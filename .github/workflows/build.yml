name: Build Aseprite

on:
  workflow_dispatch:
    inputs:
      aseprite_ref:
        description: 'Aseprite 分支/标签/提交'
        required: false
        default: 'main'
        type: string
  schedule:
    - cron: '0 0 1 * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: win64
            skia_arch: x64
            laf_backend: skia_win32
          - os: ubuntu-latest
            os_name: linux64
            skia_arch: x64
            laf_backend: skia_x11
          - os: macos-14
            os_name: macos-arm64
            skia_arch: arm64
            laf_backend: skia_metal

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出 Aseprite 源码
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ github.event.inputs.aseprite_ref || 'main' }}
          path: aseprite
          submodules: recursive

      - name: 安装依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev

      - name: 安装 Ninja
        uses: aseprite/get-ninja@main

      - name: 配置 Visual Studio 环境 (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: 读取 Skia 版本标签
        id: skia_tag
        working-directory: aseprite/laf
        run: |
          tag=$(cat misc/skia-tag.txt | xargs)
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: 下载预编译 Skia
        run: |
          tag="${{ steps.skia_tag.outputs.tag }}"
          case "${{ runner.os }}" in
            Windows) os=Windows ;;
            macOS) os=macOS ;;
            Linux) os=Linux ;;
          esac
          skia_url="https://github.com/aseprite/skia/releases/download/$tag/Skia-$os-Release-${{ matrix.skia_arch }}.zip"
          echo "下载 Skia: $skia_url"
          curl --ssl-revoke-best-effort -L -o skia.zip "$skia_url"
          unzip -q skia.zip -d skia

      - name: CMake 配置
        working-directory: aseprite
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=${{ matrix.laf_backend }} \
            -DSKIA_DIR=$(pwd)/../skia \
            -DSKIA_LIBRARY_DIR=$(pwd)/../skia/out/Release-${{ matrix.skia_arch }}

      - name: 编译
        working-directory: aseprite
        run: |
          cd build && ninja

      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        working-directory: aseprite/build
        run: |
          version=$(strings bin/aseprite.exe | grep -oP '\d+\.\d+\.\d+' | head -1)
          [ -z "$version" ] && version=$(date +%Y%m%d)
          dirName="aseprite-$version-win64"
          mkdir -p "dist/$dirName"
          cp bin/aseprite.exe "dist/$dirName/"
          cp -r bin/data "dist/$dirName/" 2>/dev/null || true
          cd dist && 7z a -tzip "${dirName}.zip" "$dirName" && mv "${dirName}.zip" ../

      - name: 打包 (Linux)
        if: runner.os == 'Linux'
        working-directory: aseprite/build
        run: |
          version=$(strings bin/aseprite | grep -oP '\d+\.\d+\.\d+' | head -1)
          [ -z "$version" ] && version=$(date +%Y%m%d)
          dirName="aseprite-$version-linux64"
          mkdir -p "dist/$dirName"
          cp bin/aseprite "dist/$dirName/"
          cp -r bin/data "dist/$dirName/" 2>/dev/null || true
          cd dist && tar czf "../${dirName}.tar.gz" "$dirName"

      - name: 打包 (macOS)
        if: runner.os == 'macOS'
        working-directory: aseprite/build
        run: |
          version=$(plutil -p bin/Aseprite.app/Contents/Info.plist | grep -o '"CFBundleShortVersionString"[[:space:]]*=>[[:space:]]*"[^"]*"' | sed 's/.*"=> "\(.*\)"/\1/' 2>/dev/null || strings bin/aseprite | grep -oP '\d+\.\d+\.\d+' | head -1)
          [ -z "$version" ] && version=$(date +%Y%m%d)
          dirName="aseprite-$version-macos-arm64"
          mkdir -p "dist"
          cp -r bin/Aseprite.app "dist/$dirName.app" 2>/dev/null || {
            mkdir -p "dist/$dirName"
            cp bin/aseprite "dist/$dirName/"
            cp -r bin/data "dist/$dirName/" 2>/dev/null || true
          }
          cd dist && zip -ry "../${dirName}.zip" "$(ls | head -1)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ matrix.os_name }}
          path: aseprite/build/*.zip
          if-no-files-found: warn

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: aseprite-*
          merge-multiple: true

      - name: 创建 Release 并上传
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: "Aseprite 自动构建 #${{ github.run_number }}"
          artifacts: "aseprite-*.*"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
