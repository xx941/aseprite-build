name: Build Aseprite

on:
  workflow_dispatch:
    inputs:
      aseprite_ref:
        description: 'Aseprite 分支/标签/提交'
        required: false
        default: 'main'
        type: string
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: win64
            skia_arch: x64
            laf_backend: skia_win32
          - os: ubuntu-latest
            os_name: linux64
            skia_arch: x64
            laf_backend: skia_x11
          - os: macos-latest
            os_name: macos-arm64
            skia_arch: arm64
            laf_backend: skia_metal

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出本仓库 (含工作流文件)
        uses: actions/checkout@v4

      - name: 克隆 Aseprite 源码 (含子模块)
        run: |
          git clone https://github.com/aseprite/aseprite.git aseprite \
            --branch ${{ github.event.inputs.aseprite_ref || 'main' }} \
            --recursive --depth 1

      - name: 安装依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev

      - name: 安装 Ninja
        uses: aseprite/get-ninja@main

      - name: 配置 Visual Studio 环境 (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: 读取 Skia 版本标签
        id: skia_tag
        working-directory: aseprite/laf
        run: |
          tag=$(cat misc/skia-tag.txt | xargs)
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: 下载预编译 Skia
        run: |
          tag="${{ steps.skia_tag.outputs.tag }}"
          case "${{ runner.os }}" in
            Windows) os=Windows ;;
            macOS) os=macOS ;;
            Linux) os=Linux ;;
          esac
          skia_url="https://github.com/aseprite/skia/releases/download/$tag/Skia-$os-Release-${{ matrix.skia_arch }}.zip"
          echo "下载 Skia: $skia_url"
          curl --ssl-revoke-best-effort -L -o skia.zip "$skia_url"
          mkdir -p skia
          unzip -q skia.zip -d skia
          echo "Skia 目录结构:"
          ls -la skia/
          ls -la skia/out/Release-${{ matrix.skia_arch }}/ 2>/dev/null || echo "无 out/Release 目录"

      - name: CMake 配置
        working-directory: aseprite
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$(realpath ../skia) \
            -DSKIA_LIBRARY_DIR=$(realpath ../skia/out/Release-${{ matrix.skia_arch }})

      - name: 编译
        working-directory: aseprite
        run: |
          cd build && ninja

      - name: 打包
        working-directory: aseprite/build
        run: |
          pkg="${{ matrix.os_name }}"
          mkdir -p "dist"
          cp bin/aseprite* "dist/" 2>/dev/null || true
          cp -r bin/data "dist/" 2>/dev/null || true

      - name: 压缩打包 (Windows)
        if: runner.os == 'Windows'
        working-directory: aseprite/build
        run: |
          cd dist && 7z a -tzip "../aseprite-${{ matrix.os_name }}.zip" ./*

      - name: 压缩打包 (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: aseprite/build
        run: |
          cd dist && tar czf "../aseprite-${{ matrix.os_name }}.tar.gz" ./*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ matrix.os_name }}
          path: |
            aseprite/build/aseprite-${{ matrix.os_name }}.zip
            aseprite/build/aseprite-${{ matrix.os_name }}.tar.gz
          if-no-files-found: warn

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: aseprite-*
          merge-multiple: true

      - name: 创建 Release 并上传
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: "Aseprite 自动构建 #${{ github.run_number }}"
          artifacts: "aseprite-*.*"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
